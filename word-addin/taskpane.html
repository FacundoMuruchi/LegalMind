<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Legal Graph Chat</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./taskpane.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">G</div>
          <div>
          <p class="eyebrow">LangGraph</p>
          <h1>Legal Chat</h1>
          </div>
        </div>
        <button class="icon-button" id="new-chat" type="button" title="New conversation" aria-label="New conversation">
          <span aria-hidden="true">+</span>
        </button>
      </header>

      <section class="status-row" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting to graph</span>
      </section>

      <section class="messages" id="messages" aria-label="Conversation">
        <article class="message assistant">
          <p>Ready. Ask the graph anything.</p>
        </article>
      </section>

      <form class="composer" id="chat-form">
        <textarea id="message-input" rows="1" placeholder="Ask the graph" autocomplete="off"></textarea>
        <button id="send-button" type="submit" aria-label="Send message">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
    </main>
    <script src="./taskpane.js"></script>
  </body>
</html>
